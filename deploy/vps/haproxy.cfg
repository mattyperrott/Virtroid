global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    timeout connect 5s
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout queue 10s
    timeout client 30s
    timeout server 30s
    timeout client-fin 10s
    timeout server-fin 10s
    timeout tunnel 1h

frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/virtroid.pem alpn http/1.1
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy no-referrer

    acl relay_connect method CONNECT
    acl relay_path path_beg /api/v1/relay/
    acl private_metrics path -i /metrics
    http-request deny deny_status 404 if private_metrics
    use_backend virtnoded_relay if relay_connect relay_path
    use_backend virtnoded_relay if relay_path
    default_backend virtroidd_api

backend virtroidd_api
    server virtroidd virtroidd:8080 check

backend virtnoded_relay
    server virtnoded virtnoded:8090 check
