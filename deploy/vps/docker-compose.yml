services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an immutable postgres image with @sha256 digest}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtroid}
      POSTGRES_USER: ${POSTGRES_USER:-virtroid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1g}"
    cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  virtroidd:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    container_name: virtroidd
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      BIND_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-virtroid}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-virtroid}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL, for example https://your-domain.example}
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:?set PUBLIC_RELAY_URL, for example https://your-domain.example}
      CONTROL_PLANE_CALLBACK_PRIVATE_KEY_B64: ${CONTROL_PLANE_CALLBACK_PRIVATE_KEY_B64:?set CONTROL_PLANE_CALLBACK_PRIVATE_KEY_B64}
      NODE_DEVELOPMENT_ENROLLMENT_ENABLED: "false"
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-true}
      BOOTSTRAP_REQUIRE_INVITE: ${BOOTSTRAP_REQUIRE_INVITE:-true}
      BOOTSTRAP_AUTO_ISSUE_INVITE: ${BOOTSTRAP_AUTO_ISSUE_INVITE:-true}
      BOOTSTRAP_RATE_LIMIT_PER_MINUTE: ${BOOTSTRAP_RATE_LIMIT_PER_MINUTE:-5}
      BOOTSTRAP_MAX_BODY_BYTES: ${BOOTSTRAP_MAX_BODY_BYTES:-32768}
      NODE_ALLOWED_ADVERTISE_ADDRS: ${NODE_ALLOWED_ADVERTISE_ADDRS:?set NODE_ALLOWED_ADVERTISE_ADDRS}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      SECURITY_EVENT_RATE_LIMIT_PER_MINUTE: ${SECURITY_EVENT_RATE_LIMIT_PER_MINUTE:-120}
      SECURITY_EVENT_RETENTION: ${SECURITY_EVENT_RETENTION:-168h}
      RUNTIME_LOG_RETENTION: ${RUNTIME_LOG_RETENTION:-720h}
      SESSION_REAPER_INTERVAL: ${SESSION_REAPER_INTERVAL:-30s}
      ACTIVE_SESSION_TIMEOUT: ${ACTIVE_SESSION_TIMEOUT:-2m}
      RUNTIME_IDLE_TIMEOUT: ${RUNTIME_IDLE_TIMEOUT:-3m}
      APP_CATALOG_SYNC_ENABLED: ${APP_CATALOG_SYNC_ENABLED:-false}
      APP_CATALOG_SYNC_URL: ${APP_CATALOG_SYNC_URL:-https://f-droid.org/repo/index-v2.json}
      APP_CATALOG_SYNC_SHA256: ${APP_CATALOG_SYNC_SHA256:-}
      APP_CATALOG_SYNC_INTERVAL: ${APP_CATALOG_SYNC_INTERVAL:-12h}
      APP_CATALOG_SYNC_MAX_APPS: ${APP_CATALOG_SYNC_MAX_APPS:-1500}
      RUNTIME_NOTIFICATION_RATE_LIMIT_PER_MINUTE: ${RUNTIME_NOTIFICATION_RATE_LIMIT_PER_MINUTE:-120}
      VIRTROID_HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
    ports:
      - "${HOST_API_BIND:-127.0.0.1}:8080:8080"
    mem_limit: "${VIRTROIDD_MEMORY_LIMIT:-512m}"
    cpus: "${VIRTROIDD_CPU_LIMIT:-1.0}"
    pids_limit: ${VIRTROIDD_PIDS_LIMIT:-256}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-egress
      - database
      - control

  virtnoded:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    container_name: virtnoded
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    command: ["virtnoded"]
    user: "0:0"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the host docker group id, e.g. getent group docker | cut -d: -f3}"
    restart: unless-stopped
    depends_on:
      - virtroidd
    environment:
      NODE_BIND_ADDR: :8090
      CONTROL_PLANE_URL: http://virtroidd:8080
      NODE_PUBLIC_CONTROL_PLANE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      NODE_ID: ${NODE_ID:-mp-vps-storage}
      NODE_NAME: ${NODE_NAME:-mp-vps-storage}
      NODE_ADVERTISE_ADDR: ${NODE_ADVERTISE_ADDR:?set NODE_ADVERTISE_ADDR}
      NODE_ADB_PATH: /usr/bin/adb
      NODE_PRIVATE_KEY_B64: ${NODE_PRIVATE_KEY_B64:?set NODE_PRIVATE_KEY_B64 to a base64 PKCS8 P-256 private key}
      CONTROL_PLANE_CALLBACK_PUBLIC_KEY_B64: ${CONTROL_PLANE_CALLBACK_PUBLIC_KEY_B64:?set CONTROL_PLANE_CALLBACK_PUBLIC_KEY_B64}
      NODE_APP_APK_DIR: /srv/virtroid/apks
      NODE_APP_MANIFEST_PATH: /srv/virtroid/apks/manifest.json
      NODE_DEFAULT_APP_PACKAGES: ${NODE_DEFAULT_APP_PACKAGES:-org.fdroid.basic}
      NODE_NOTIFICATION_AGENT_ENABLED: "true"
      NODE_NOTIFICATION_AGENT_APK_PATH: /srv/virtroid/apks/virtroid-runtime-agent.apk
      NODE_NOTIFICATION_AGENT_APK_SHA256: ${NODE_NOTIFICATION_AGENT_APK_SHA256:?set NODE_NOTIFICATION_AGENT_APK_SHA256}
      NODE_BLOB_STORE_KIND: ${NODE_BLOB_STORE_KIND:-local-disk}
      NODE_SIA_RENTERD_WORKER_URL: ${NODE_SIA_RENTERD_WORKER_URL:-}
      NODE_SIA_RENTERD_PASSWORD_FILE: /run/secrets/renterd-api-password
      NODE_SIA_RENTERD_BUCKET: ${NODE_SIA_RENTERD_BUCKET:-virtroid}
      NODE_SIA_RENTERD_WALLET_ADDRESS: ${NODE_SIA_RENTERD_WALLET_ADDRESS:-}
      NODE_SIA_RENTERD_MIN_SHARDS: ${NODE_SIA_RENTERD_MIN_SHARDS:-}
      NODE_SIA_RENTERD_TOTAL_SHARDS: ${NODE_SIA_RENTERD_TOTAL_SHARDS:-}
      NODE_SIA_RENTERD_CONTRACT_SET: ${NODE_SIA_RENTERD_CONTRACT_SET:-}
      NODE_BLOB_PREFLIGHT_INTERVAL: ${NODE_BLOB_PREFLIGHT_INTERVAL:-5m}
      NODE_HEARTBEAT_INTERVAL: 30s
      NODE_RECONCILE_INTERVAL: 10s
      NODE_DOCKER_NETWORK: ${NODE_DOCKER_NETWORK:?set NODE_DOCKER_NETWORK to the dedicated guest network name}
      NODE_RUNTIME_NETWORK_MODE: ${NODE_RUNTIME_NETWORK_MODE:-per-runtime}
      NODE_AGENT_CONTAINER_NAME: ${NODE_AGENT_CONTAINER_NAME:-virtnoded}
      NODE_RUNTIME_IMAGE: ${NODE_RUNTIME_IMAGE:?set NODE_RUNTIME_IMAGE to an immutable ReDroid image with @sha256 digest}
      NODE_REQUIRE_DIGESTED_RUNTIME_IMAGE: "true"
      NODE_RUNTIME_MEMORY_BYTES: ${NODE_RUNTIME_MEMORY_BYTES:-4294967296}
      NODE_RUNTIME_NANO_CPUS: ${NODE_RUNTIME_NANO_CPUS:-2000000000}
      NODE_RUNTIME_PIDS_LIMIT: ${NODE_RUNTIME_PIDS_LIMIT:-4096}
      NODE_RUNTIME_SHM_BYTES: ${NODE_RUNTIME_SHM_BYTES:-268435456}
      NODE_RUNTIME_ROOT: /srv/virtroid/runtimes
      NODE_MIN_FREE_DISK_BYTES: ${NODE_MIN_FREE_DISK_BYTES:-10737418240}
      NODE_MIN_FREE_DISK_PERCENT: ${NODE_MIN_FREE_DISK_PERCENT:-5}
      VIRTROID_HEALTHCHECK_URL: http://127.0.0.1:8090/healthz
    ports:
      - "${HOST_RELAY_BIND:-127.0.0.1}:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs:ro
      - /srv/virtroid:/srv/virtroid
      - ${RENTERD_API_PASSWORD_FILE:-/etc/virtroid/secrets/renterd-api-password}:/run/secrets/renterd-api-password:ro
    mem_limit: "${VIRTNODED_MEMORY_LIMIT:-1g}"
    cpus: "${VIRTNODED_CPU_LIMIT:-2.0}"
    pids_limit: ${VIRTNODED_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - guest
      - control
      - blob

  virtroid-admin:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    entrypoint: ["/usr/local/bin/virtroid-admin"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-virtroid}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-virtroid}?sslmode=disable
      NODE_ID: ${NODE_ID:-mp-vps-storage}
      NODE_PRIVATE_KEY_B64: ${NODE_PRIVATE_KEY_B64:?set NODE_PRIVATE_KEY_B64 to a base64 PKCS8 P-256 private key}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    networks:
      - database

  renterd-mysql:
    image: ${RENTERD_MYSQL_IMAGE:-virtroid-renterd-mysql-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-renterd-mysql
    restart: unless-stopped
    profiles:
      - renterd
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/renterd-mysql-root-password
      MYSQL_DATABASE: renterd
      MYSQL_USER: renterd
      MYSQL_PASSWORD_FILE: /run/secrets/renterd-mysql-password
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - renterd-mysql-data:/var/lib/mysql
      - ${RENTERD_MYSQL_ROOT_PASSWORD_FILE:-/etc/virtroid/secrets/renterd-mysql-root-password}:/run/secrets/renterd-mysql-root-password:ro
      - ${RENTERD_MYSQL_PASSWORD_FILE:-/etc/virtroid/secrets/renterd-mysql-password}:/run/secrets/renterd-mysql-password:ro
      - ./renterd-mysql-init.sql:/docker-entrypoint-initdb.d/10-renterd-metrics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/renterd-mysql-password)\" mysqladmin ping -h 127.0.0.1 -u renterd --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: "${RENTERD_MYSQL_MEMORY_LIMIT:-2g}"
    cpus: "${RENTERD_MYSQL_CPU_LIMIT:-2.0}"
    pids_limit: ${RENTERD_MYSQL_PIDS_LIMIT:-512}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - renterd-database

  renterd:
    image: ${RENTERD_IMAGE:-virtroid-renterd-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-renterd
    restart: unless-stopped
    profiles:
      - renterd
    depends_on:
      renterd-mysql:
        condition: service_healthy
    environment:
      RENTERD_CONFIG_FILE: /run/secrets/renterd.yml
      RENTERD_LOG_LEVEL: ${RENTERD_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:9980:9980"
      - "127.0.0.1:9981:9981"
    volumes:
      - renterd-data:/data
      - ${RENTERD_CONFIG_FILE:-/etc/virtroid/secrets/renterd.yml}:/run/secrets/renterd.yml:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 5m
    mem_limit: "${RENTERD_MEMORY_LIMIT:-4g}"
    cpus: "${RENTERD_CPU_LIMIT:-4.0}"
    pids_limit: ${RENTERD_PIDS_LIMIT:-1024}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - renterd-egress
      - blob
      - renterd-database

  edge:
    image: ${HAPROXY_IMAGE:-virtroid-edge-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-edge
    group_add:
      - "${HAPROXY_CERT_GID:?set HAPROXY_CERT_GID to the host virtroid-cert group id}"
    restart: unless-stopped
    profiles:
      - edge
    depends_on:
      - virtroidd
      - virtnoded
    ports:
      - "443:443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${HAPROXY_CERT_PATH:-/srv/virtroid/tls/virtroid.pem}:/usr/local/etc/haproxy/certs/virtroid.pem:ro
    mem_limit: "${HAPROXY_MEMORY_LIMIT:-256m}"
    cpus: "${HAPROXY_CPU_LIMIT:-0.5}"
    pids_limit: ${HAPROXY_PIDS_LIMIT:-128}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-egress
      - control

  falco:
    image: ${FALCO_IMAGE:-virtroid-falco-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-falco
    restart: unless-stopped
    profiles:
      - falco
    depends_on:
      - falco-forwarder
    pid: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    command:
      - falco
      - -o
      - json_output=true
      - -o
      - stdout_output.enabled=true
      - -o
      - http_output.enabled=true
      - -o
      - http_output.url=http://falco-forwarder:8766/falco
      - -o
      - priority=${FALCO_MIN_PRIORITY:-error}
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./falco/falco_rules.local.yaml:/etc/falco/rules.d/virtroid_rules.yaml:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "${FALCO_MEMORY_LIMIT:-1g}"
    cpus: "${FALCO_CPU_LIMIT:-1.0}"
    pids_limit: ${FALCO_PIDS_LIMIT:-512}
    networks:
      - monitoring

  falco-forwarder:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    container_name: virtroid-falco-forwarder
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    command: ["falco-forwarder"]
    user: "0:0"
    restart: unless-stopped
    profiles:
      - falco
      - nids
    depends_on:
      - virtroidd
    environment:
      CONTROL_PLANE_URL: http://virtroidd:8080
      NODE_ID: ${NODE_ID:-mp-vps-storage}
      NODE_PRIVATE_KEY_B64: ${NODE_PRIVATE_KEY_B64:?set NODE_PRIVATE_KEY_B64 to a base64 PKCS8 P-256 private key}
      FALCO_FORWARDER_BIND_ADDR: :8766
      FALCO_FORWARD_MAX_EVENTS_PER_MINUTE: ${FALCO_FORWARD_MAX_EVENTS_PER_MINUTE:-120}
      FALCO_FORWARD_DEDUP_WINDOW: ${FALCO_FORWARD_DEDUP_WINDOW:-5s}
      SURICATA_EVE_FILE: /var/log/suricata/eve.json
      VIRTROID_HEALTHCHECK_URL: http://127.0.0.1:8766/healthz
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "${FALCO_FORWARDER_MEMORY_LIMIT:-256m}"
    cpus: "${FALCO_FORWARDER_CPU_LIMIT:-0.5}"
    pids_limit: ${FALCO_FORWARDER_PIDS_LIMIT:-128}
    volumes:
      - suricata-logs:/var/log/suricata:ro
    networks:
      - monitoring
      - control

  suricata:
    image: ${SURICATA_IMAGE:-virtroid-suricata-profile-disabled}
    container_name: virtroid-suricata
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    entrypoint: ["suricata"]
    restart: unless-stopped
    profiles:
      - nids
    depends_on:
      - falco-forwarder
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    command:
      - -i
      - ${SURICATA_INTERFACE:?set SURICATA_INTERFACE to the reviewed host ingress interface}
      - -S
      - /etc/suricata/rules/virtroid.rules
      - -l
      - /var/log/suricata
    volumes:
      - ./suricata/virtroid.rules:/etc/suricata/rules/virtroid.rules:ro
      - suricata-logs:/var/log/suricata
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/lib/suricata:rw,nosuid,nodev,size=64m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "${SURICATA_MEMORY_LIMIT:-1g}"
    cpus: "${SURICATA_CPU_LIMIT:-1.0}"
    pids_limit: ${SURICATA_PIDS_LIMIT:-512}

  prometheus:
    image: ${PROMETHEUS_IMAGE:-virtroid-prometheus-profile-disabled}
    container_name: virtroid-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    depends_on:
      - virtroidd
      - virtnoded
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/virtroid-alerts.yml:/etc/prometheus/rules/virtroid-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    mem_limit: "${PROMETHEUS_MEMORY_LIMIT:-1g}"
    cpus: "${PROMETHEUS_CPU_LIMIT:-1.0}"
    pids_limit: ${PROMETHEUS_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring-egress
      - monitoring
      - control

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-virtroid-alertmanager-profile-disabled}
    container_name: virtroid-alertmanager
    restart: unless-stopped
    profiles:
      - monitoring
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: "${ALERTMANAGER_MEMORY_LIMIT:-256m}"
    cpus: "${ALERTMANAGER_CPU_LIMIT:-0.5}"
    pids_limit: ${ALERTMANAGER_PIDS_LIMIT:-128}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring-egress
      - monitoring

networks:
  database:
    internal: true
  control:
    internal: true
  blob:
    internal: true
  monitoring:
