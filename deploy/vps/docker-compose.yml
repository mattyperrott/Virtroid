services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an immutable postgres image with @sha256 digest}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtroid}
      POSTGRES_USER: ${POSTGRES_USER:-virtroid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-1g}"
    cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  virtroidd:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    container_name: virtroidd
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    restart: unless-stopped
    group_add:
      - "${OPERATOR_SECRET_GID:-65534}"
      # A placeholder group until the indexd profile's dedicated one is set.
      - "${SIA_SECRET_GID:-65533}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      BIND_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-virtroid}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-virtroid}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL, for example https://your-domain.example}
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:?set PUBLIC_RELAY_URL, for example https://your-domain.example}
      CONTROL_PLANE_CALLBACK_PRIVATE_KEY_B64: ${CONTROL_PLANE_CALLBACK_PRIVATE_KEY_B64:?set CONTROL_PLANE_CALLBACK_PRIVATE_KEY_B64}
      NODE_DEVELOPMENT_ENROLLMENT_ENABLED: "false"
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-true}
      BOOTSTRAP_REQUIRE_INVITE: ${BOOTSTRAP_REQUIRE_INVITE:-true}
      BOOTSTRAP_AUTO_ISSUE_INVITE: ${BOOTSTRAP_AUTO_ISSUE_INVITE:-true}
      BOOTSTRAP_RATE_LIMIT_PER_MINUTE: ${BOOTSTRAP_RATE_LIMIT_PER_MINUTE:-5}
      BOOTSTRAP_MAX_BODY_BYTES: ${BOOTSTRAP_MAX_BODY_BYTES:-32768}
      NODE_ALLOWED_ADVERTISE_ADDRS: ${NODE_ALLOWED_ADVERTISE_ADDRS:?set NODE_ALLOWED_ADVERTISE_ADDRS}
      # Comma-separated IPs of remote nodes that serve their own TLS endpoint.
      NODE_ALLOWED_REMOTE_ADDRS: ${NODE_ALLOWED_REMOTE_ADDRS:-}
      # Dedicated runtime VMs on Aleph Cloud; PROVISIONER_MAX_VMS=0 turns them off.
      PROVISIONER_PUBLIC_KEY: ${PROVISIONER_PUBLIC_KEY:-}
      PROVISIONED_REGIONS: ${PROVISIONED_REGIONS:-}
      PROVISIONER_MAX_VMS: ${PROVISIONER_MAX_VMS:-0}
      PROVISIONER_WARM_SPARES: ${PROVISIONER_WARM_SPARES:-0}
      PROVISIONER_SETUP_TIMEOUT: ${PROVISIONER_SETUP_TIMEOUT:-30m}
      PROVISIONER_RETIRE_AFTER: ${PROVISIONER_RETIRE_AFTER:-2h}
      # Signed list of approved runtime VM measurements (virtroid-measurements sign).
      SNP_MEASUREMENTS_PATH: /run/virtroid/snp-measurements.json
      # Runtime snapshots on Sia through indexd (indexd.md); empty leaves it off.
      SIA_INDEXER_APP_URL: ${SIA_INDEXER_APP_URL:-}
      SIA_INDEXER_ADMIN_URL: http://indexd:9980/api
      SIA_INDEXER_ADMIN_PASSWORD_FILE: /run/secrets/sia-indexer-admin-password
      SIA_KEY_SECRET_FILE: /run/secrets/sia-key-secret
      SIA_DATA_SHARDS: ${SIA_DATA_SHARDS:-10}
      SIA_TOTAL_SHARDS: ${SIA_TOTAL_SHARDS:-30}
      SIA_MAX_PINNED_BYTES: ${SIA_MAX_PINNED_BYTES:-68719476736}
      SIA_FUND_TARGET_BYTES: ${SIA_FUND_TARGET_BYTES:-1073741824}
      # USDT (TRC20) wallets (payments.md); an empty xpub leaves them off.
      TRON_DEPOSIT_XPUB: ${TRON_DEPOSIT_XPUB:-}
      PAYMENTS_PUBLIC_KEY: ${PAYMENTS_PUBLIC_KEY:-}
      # What paid accounts are charged, in millionths of a USDT.
      RUNTIME_PRICE_PER_HOUR_MICRO: ${RUNTIME_PRICE_PER_HOUR_MICRO:-100000}
      STORAGE_PRICE_PER_GIB_MONTH_MICRO: ${STORAGE_PRICE_PER_GIB_MONTH_MICRO:-50000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      SECURITY_EVENT_RATE_LIMIT_PER_MINUTE: ${SECURITY_EVENT_RATE_LIMIT_PER_MINUTE:-120}
      SECURITY_EVENT_RETENTION: ${SECURITY_EVENT_RETENTION:-168h}
      RUNTIME_LOG_RETENTION: ${RUNTIME_LOG_RETENTION:-720h}
      SESSION_REAPER_INTERVAL: ${SESSION_REAPER_INTERVAL:-30s}
      ACTIVE_SESSION_TIMEOUT: ${ACTIVE_SESSION_TIMEOUT:-2m}
      RUNTIME_IDLE_TIMEOUT: ${RUNTIME_IDLE_TIMEOUT:-15m}
      APP_CATALOG_SYNC_ENABLED: ${APP_CATALOG_SYNC_ENABLED:-false}
      APP_CATALOG_SYNC_URL: ${APP_CATALOG_SYNC_URL:-https://f-droid.org/repo/index-v2.json}
      APP_CATALOG_SYNC_SHA256: ${APP_CATALOG_SYNC_SHA256:-}
      APP_CATALOG_SYNC_INTERVAL: ${APP_CATALOG_SYNC_INTERVAL:-12h}
      APP_CATALOG_SYNC_MAX_APPS: ${APP_CATALOG_SYNC_MAX_APPS:-1500}
      RUNTIME_NOTIFICATION_RATE_LIMIT_PER_MINUTE: ${RUNTIME_NOTIFICATION_RATE_LIMIT_PER_MINUTE:-120}
      OPERATOR_CONSOLE_ENABLED: ${OPERATOR_CONSOLE_ENABLED:-false}
      OPERATOR_CONSOLE_TOKEN_FILE: /run/secrets/operator-console-token
      OPERATOR_SESSION_TTL: ${OPERATOR_SESSION_TTL:-8h}
      OPERATOR_LOGIN_RATE_LIMIT_PER_MINUTE: ${OPERATOR_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      VIRTROID_SOURCE_SHA: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA}
      VIRTROID_SCHEMA_VERSION: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION}
      VIRTROID_DEPLOYMENT_TREE_SHA256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256}
      VIRTROID_HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
      DEMO_STREAM_TARGET: ${DEMO_STREAM_TARGET:-}
      DEMO_STREAM_DEVICE: ${DEMO_STREAM_DEVICE:-}
      DEMO_SESSION_TTL: ${DEMO_SESSION_TTL:-8m}
      DEMO_ADB_TARGET: ${DEMO_ADB_TARGET:-}
    ports:
      - "${HOST_API_BIND:-127.0.0.1}:8080:8080"
    mem_limit: "${VIRTROIDD_MEMORY_LIMIT:-512m}"
    cpus: "${VIRTROIDD_CPU_LIMIT:-1.0}"
    pids_limit: ${VIRTROIDD_PIDS_LIMIT:-256}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes:
      - ${OPERATOR_CONSOLE_TOKEN_FILE:-./operator-console-disabled}:/run/secrets/operator-console-token:ro
      - ${SNP_MEASUREMENTS_FILE:-./snp-measurements-disabled}:/run/virtroid/snp-measurements.json:ro
      - ${SIA_INDEXER_ADMIN_PASSWORD_FILE:-./sia-disabled}:/run/secrets/sia-indexer-admin-password:ro
      - ${SIA_KEY_SECRET_FILE:-./sia-disabled}:/run/secrets/sia-key-secret:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-egress
      - database
      - control
      - demo
      - sia

  virtnoded:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    container_name: virtnoded
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    command: ["virtnoded"]
    user: "0:0"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the host docker group id, e.g. getent group docker | cut -d: -f3}"
    restart: unless-stopped
    depends_on:
      - virtroidd
    environment:
      NODE_BIND_ADDR: :8090
      CONTROL_PLANE_URL: http://virtroidd:8080
      NODE_PUBLIC_CONTROL_PLANE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      NODE_ID: ${NODE_ID:-mp-vps-storage}
      NODE_NAME: ${NODE_NAME:-mp-vps-storage}
      NODE_ADVERTISE_ADDR: ${NODE_ADVERTISE_ADDR:?set NODE_ADVERTISE_ADDR}
      NODE_ADB_PATH: /usr/bin/adb
      NODE_PRIVATE_KEY_B64: ${NODE_PRIVATE_KEY_B64:?set NODE_PRIVATE_KEY_B64 to a base64 PKCS8 P-256 private key}
      CONTROL_PLANE_CALLBACK_PUBLIC_KEY_B64: ${CONTROL_PLANE_CALLBACK_PUBLIC_KEY_B64:?set CONTROL_PLANE_CALLBACK_PUBLIC_KEY_B64}
      NODE_APP_APK_DIR: /srv/virtroid/apks
      NODE_APP_MANIFEST_PATH: /srv/virtroid/apks/manifest.json
      NODE_DEFAULT_APP_PACKAGES: ${NODE_DEFAULT_APP_PACKAGES:-org.fdroid.basic}
      NODE_NOTIFICATION_AGENT_ENABLED: "true"
      NODE_NOTIFICATION_AGENT_APK_PATH: /srv/virtroid/apks/virtroid-runtime-agent.apk
      NODE_NOTIFICATION_AGENT_APK_SHA256: ${NODE_NOTIFICATION_AGENT_APK_SHA256:?set NODE_NOTIFICATION_AGENT_APK_SHA256}
      NODE_BLOB_STORE_KIND: ${NODE_BLOB_STORE_KIND:-local-disk}
      NODE_SIA_RENTERD_WORKER_URL: ${NODE_SIA_RENTERD_WORKER_URL:-}
      NODE_SIA_RENTERD_PASSWORD_FILE: /run/secrets/renterd-api-password
      NODE_SIA_RENTERD_BUCKET: ${NODE_SIA_RENTERD_BUCKET:-virtroid}
      NODE_SIA_RENTERD_WALLET_ADDRESS: ${NODE_SIA_RENTERD_WALLET_ADDRESS:-}
      NODE_SIA_RENTERD_MIN_SHARDS: ${NODE_SIA_RENTERD_MIN_SHARDS:-}
      NODE_SIA_RENTERD_TOTAL_SHARDS: ${NODE_SIA_RENTERD_TOTAL_SHARDS:-}
      NODE_SIA_RENTERD_CONTRACT_SET: ${NODE_SIA_RENTERD_CONTRACT_SET:-}
      NODE_BLOB_PREFLIGHT_INTERVAL: ${NODE_BLOB_PREFLIGHT_INTERVAL:-5m}
      NODE_HEARTBEAT_INTERVAL: 30s
      NODE_RECONCILE_INTERVAL: 10s
      NODE_DOCKER_NETWORK: ${NODE_DOCKER_NETWORK:?set NODE_DOCKER_NETWORK to the dedicated guest network name}
      NODE_RUNTIME_NETWORK_MODE: ${NODE_RUNTIME_NETWORK_MODE:-per-runtime}
      NODE_AGENT_CONTAINER_NAME: ${NODE_AGENT_CONTAINER_NAME:-virtnoded}
      NODE_RUNTIME_IMAGE: ${NODE_RUNTIME_IMAGE:?set NODE_RUNTIME_IMAGE to an immutable ReDroid image with @sha256 digest}
      NODE_REQUIRE_DIGESTED_RUNTIME_IMAGE: "true"
      NODE_RUNTIME_MEMORY_BYTES: ${NODE_RUNTIME_MEMORY_BYTES:-4294967296}
      NODE_RUNTIME_NANO_CPUS: ${NODE_RUNTIME_NANO_CPUS:-2000000000}
      NODE_RUNTIME_PIDS_LIMIT: ${NODE_RUNTIME_PIDS_LIMIT:-4096}
      NODE_RUNTIME_SHM_BYTES: ${NODE_RUNTIME_SHM_BYTES:-268435456}
      NODE_RUNTIME_ROOT: /srv/virtroid/runtimes
      NODE_MIN_FREE_DISK_BYTES: ${NODE_MIN_FREE_DISK_BYTES:-10737418240}
      NODE_MIN_FREE_DISK_PERCENT: ${NODE_MIN_FREE_DISK_PERCENT:-5}
      VIRTROID_HEALTHCHECK_URL: http://127.0.0.1:8090/healthz
    ports:
      - "${HOST_RELAY_BIND:-127.0.0.1}:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs:ro
      - /srv/virtroid:/srv/virtroid
      - ${RENTERD_API_PASSWORD_FILE:-/etc/virtroid/secrets/renterd-api-password}:/run/secrets/renterd-api-password:ro
    mem_limit: "${VIRTNODED_MEMORY_LIMIT:-1g}"
    cpus: "${VIRTNODED_CPU_LIMIT:-2.0}"
    pids_limit: ${VIRTNODED_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - guest
      - control
      - blob

  provisioner:
    # Creates and deletes the dedicated SEV-SNP runtime VMs virtroidd asks for.
    # It alone holds the Aleph account key, the runtime disk passphrase, and
    # each VM's node key.
    image: ${PROVISIONER_IMAGE:-virtroid-provisioner-profile-disabled}
    container_name: virtroid-provisioner
    profiles:
      - provisioner
    restart: unless-stopped
    depends_on:
      - virtroidd
    group_add:
      - "${PROVISIONER_SECRET_GID:-65534}"
    environment:
      CONTROL_PLANE_URL: http://virtroidd:8080
      PROVISIONER_PRIVATE_KEY_FILE: /run/secrets/provisioner-key
      VM_CONTROL_PLANE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      ALEPH_ACCOUNT: ${ALEPH_ACCOUNT:-virtroid-provisioner}
      # Optional: the address whose credits pay, after it granted the
      # provisioner permission to deploy on its behalf in the Aleph console.
      ALEPH_OWNER_ADDRESS: ${ALEPH_OWNER_ADDRESS:-}
      ALEPH_PASSWORD_FILE: /run/secrets/aleph-password
      ALEPH_CONFIG_HOME: /var/lib/virtroid-provisioner/aleph
      ALEPH_RUNTIME: ${ALEPH_RUNTIME:-}
      ALEPH_IMAGE: ${ALEPH_IMAGE:-}
      LUKS_PASSPHRASE_FILE: /run/secrets/luks-passphrase
      PROVISIONER_REGION_CRNS: ${PROVISIONER_REGION_CRNS:-}
      PROVISIONER_STATE_DIR: /var/lib/virtroid-provisioner
      VM_VCPUS: ${VM_VCPUS:-2}
      VM_MEMORY_MIB: ${VM_MEMORY_MIB:-4096}
      VM_DISK_MIB: ${VM_DISK_MIB:-4096}
      VM_DATA_MIB: ${VM_DATA_MIB:-30720}
    volumes:
      - provisioner-state:/var/lib/virtroid-provisioner
      - /etc/virtroid/secrets/provisioner-key:/run/secrets/provisioner-key:ro
      - /etc/virtroid/secrets/aleph-password:/run/secrets/aleph-password:ro
      - /etc/virtroid/secrets/luks-passphrase:/run/secrets/luks-passphrase:ro
    mem_limit: "${PROVISIONER_MEMORY_LIMIT:-512m}"
    cpus: "${PROVISIONER_CPU_LIMIT:-1.0}"
    pids_limit: ${PROVISIONER_PIDS_LIMIT:-128}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - control
      - app-egress

  payments:
    # Holds the hot wallet accounts' USDT deposit addresses belong to, finds
    # confirmed deposits, checks each on a second Tron node and reports it to
    # virtroidd (payments.md). It alone holds the seed.
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-payments
    profiles:
      - payments
    restart: unless-stopped
    depends_on:
      - virtroidd
    entrypoint: ["/usr/local/bin/virtroid-payments", "run"]
    # The image's health check probes virtroidd's port.
    healthcheck:
      disable: true
    group_add:
      - "${PAYMENTS_SECRET_GID:-65532}"
    environment:
      CONTROL_PLANE_URL: http://virtroidd:8080
      PAYMENTS_SEED_FILE: /run/secrets/payments-seed
      PAYMENTS_PRIVATE_KEY_FILE: /run/secrets/payments-key
      TRONGRID_URL: ${TRONGRID_URL:-https://api.trongrid.io}
      TRON_VERIFY_URL: ${TRON_VERIFY_URL:-https://tron-rpc.publicnode.com}
    volumes:
      - /etc/virtroid/secrets/payments-seed:/run/secrets/payments-seed:ro
      - /etc/virtroid/secrets/payments-key:/run/secrets/payments-key:ro
    mem_limit: "${PAYMENTS_MEMORY_LIMIT:-256m}"
    cpus: "${PAYMENTS_CPU_LIMIT:-0.5}"
    pids_limit: ${PAYMENTS_PIDS_LIMIT:-64}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - control
      - payments-egress

  virtroid-admin:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    entrypoint: ["/usr/local/bin/virtroid-admin"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-virtroid}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-virtroid}?sslmode=disable
      NODE_ID: ${NODE_ID:-mp-vps-storage}
      NODE_PRIVATE_KEY_B64: ${NODE_PRIVATE_KEY_B64:?set NODE_PRIVATE_KEY_B64 to a base64 PKCS8 P-256 private key}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    networks:
      - database

  renterd-mysql:
    image: ${RENTERD_MYSQL_IMAGE:-virtroid-renterd-mysql-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-renterd-mysql
    restart: unless-stopped
    profiles:
      - renterd
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/renterd-mysql-root-password
      MYSQL_DATABASE: renterd
      MYSQL_USER: renterd
      MYSQL_PASSWORD_FILE: /run/secrets/renterd-mysql-password
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - renterd-mysql-data:/var/lib/mysql
      - ${RENTERD_MYSQL_ROOT_PASSWORD_FILE:-/etc/virtroid/secrets/renterd-mysql-root-password}:/run/secrets/renterd-mysql-root-password:ro
      - ${RENTERD_MYSQL_PASSWORD_FILE:-/etc/virtroid/secrets/renterd-mysql-password}:/run/secrets/renterd-mysql-password:ro
      - ./renterd-mysql-init.sql:/docker-entrypoint-initdb.d/10-renterd-metrics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/renterd-mysql-password)\" mysqladmin ping -h 127.0.0.1 -u renterd --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: "${RENTERD_MYSQL_MEMORY_LIMIT:-2g}"
    cpus: "${RENTERD_MYSQL_CPU_LIMIT:-2.0}"
    pids_limit: ${RENTERD_MYSQL_PIDS_LIMIT:-512}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - renterd-database

  renterd:
    image: ${RENTERD_IMAGE:-virtroid-renterd-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-renterd
    restart: unless-stopped
    profiles:
      - renterd
    depends_on:
      renterd-mysql:
        condition: service_healthy
    environment:
      RENTERD_CONFIG_FILE: /run/secrets/renterd.yml
      RENTERD_LOG_LEVEL: ${RENTERD_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:9980:9980"
      - "127.0.0.1:9981:9981"
    volumes:
      - renterd-data:/data
      - ${RENTERD_CONFIG_FILE:-/etc/virtroid/secrets/renterd.yml}:/run/secrets/renterd.yml:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 5m
    mem_limit: "${RENTERD_MEMORY_LIMIT:-4g}"
    cpus: "${RENTERD_CPU_LIMIT:-4.0}"
    pids_limit: ${RENTERD_PIDS_LIMIT:-1024}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - renterd-egress
      - blob
      - renterd-database

  indexd-postgres:
    image: ${INDEXD_POSTGRES_IMAGE:-virtroid-indexd-postgres-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-indexd-postgres
    restart: unless-stopped
    profiles:
      - indexd
    environment:
      POSTGRES_DB: indexd
      POSTGRES_USER: indexd
      POSTGRES_PASSWORD_FILE: /run/secrets/indexd-postgres-password
    volumes:
      - indexd-postgres-data:/var/lib/postgresql
      - ${INDEXD_POSTGRES_PASSWORD_FILE:-/etc/virtroid/secrets/indexd-postgres-password}:/run/secrets/indexd-postgres-password:ro
    shm_size: 256mb
    mem_limit: "${INDEXD_POSTGRES_MEMORY_LIMIT:-2g}"
    cpus: "${INDEXD_POSTGRES_CPU_LIMIT:-2.0}"
    pids_limit: ${INDEXD_POSTGRES_PIDS_LIMIT:-256}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - indexd-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexd -d indexd"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The Sia indexer: it forms and renews host contracts, pays hosts from its
  # wallet and keeps the sealed metadata of every account's snapshots. Runtime
  # VMs upload to the hosts themselves; the edge serves the application API.
  indexd:
    image: ${INDEXD_IMAGE:-virtroid-indexd-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-indexd
    restart: unless-stopped
    profiles:
      - indexd
    depends_on:
      indexd-postgres:
        condition: service_healthy
    environment:
      INDEXD_CONFIG_FILE: /run/secrets/indexd.yml
      INDEXD_DATA_DIR: /data
    ports:
      # The admin API and UI, on this host only (renterd has 9980).
      - "127.0.0.1:9990:9980"
    volumes:
      - indexd-data:/data
      - ${INDEXD_CONFIG_FILE:-/etc/virtroid/secrets/indexd.yml}:/run/secrets/indexd.yml:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 2m
    # The first chain sync alone takes more than 4 GiB.
    mem_limit: "${INDEXD_MEMORY_LIMIT:-12g}"
    cpus: "${INDEXD_CPU_LIMIT:-2.0}"
    pids_limit: ${INDEXD_PIDS_LIMIT:-1024}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - indexd-egress
      - indexd-database
      - sia

  edge:
    image: ${HAPROXY_IMAGE:-virtroid-edge-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-edge
    group_add:
      - "${HAPROXY_CERT_GID:?set HAPROXY_CERT_GID to the host virtroid-cert group id}"
    restart: unless-stopped
    profiles:
      - edge
    depends_on:
      - virtroidd
      - virtnoded
    ports:
      - "443:443"
      # The Sia indexer's application API, for runtime VMs; local only until
      # SIA_APP_PUBLISH opens it (indexd.md).
      - "${SIA_APP_PUBLISH:-127.0.0.1:9982}:9982"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${HAPROXY_CERT_PATH:-/srv/virtroid/tls/virtroid.pem}:/usr/local/etc/haproxy/certs/virtroid.pem:ro
    mem_limit: "${HAPROXY_MEMORY_LIMIT:-256m}"
    cpus: "${HAPROXY_CPU_LIMIT:-0.5}"
    pids_limit: ${HAPROXY_PIDS_LIMIT:-128}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-egress
      - control
      - sia

  falco:
    image: ${FALCO_IMAGE:-virtroid-falco-profile-disabled}
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    container_name: virtroid-falco
    restart: unless-stopped
    profiles:
      - falco
    depends_on:
      - falco-forwarder
    pid: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    command:
      - falco
      - -o
      - json_output=true
      - -o
      - stdout_output.enabled=true
      - -o
      - http_output.enabled=true
      - -o
      - http_output.url=http://falco-forwarder:8766/falco
      - -o
      - priority=${FALCO_MIN_PRIORITY:-error}
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./falco/falco_rules.local.yaml:/etc/falco/rules.d/virtroid_rules.yaml:ro
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "${FALCO_MEMORY_LIMIT:-1g}"
    cpus: "${FALCO_CPU_LIMIT:-1.0}"
    pids_limit: ${FALCO_PIDS_LIMIT:-512}
    networks:
      - security-events

  falco-forwarder:
    image: ${VIRTROID_BACKEND_IMAGE:?set VIRTROID_BACKEND_IMAGE to the verified local Virtroid release tag}
    container_name: virtroid-falco-forwarder
    labels:
      com.virtroid.source-sha: ${VIRTROID_SOURCE_SHA:?set VIRTROID_SOURCE_SHA to the deployed 40-character commit SHA}
      com.virtroid.schema-version: ${VIRTROID_SCHEMA_VERSION:?set VIRTROID_SCHEMA_VERSION to the backend schema compatibility version}
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    command: ["falco-forwarder"]
    user: "0:0"
    restart: unless-stopped
    profiles:
      - falco
      - nids
    depends_on:
      - virtroidd
    environment:
      CONTROL_PLANE_URL: http://virtroidd:8080
      NODE_ID: ${NODE_ID:-mp-vps-storage}
      NODE_PRIVATE_KEY_B64: ${NODE_PRIVATE_KEY_B64:?set NODE_PRIVATE_KEY_B64 to a base64 PKCS8 P-256 private key}
      FALCO_FORWARDER_BIND_ADDR: :8766
      FALCO_FORWARD_MAX_EVENTS_PER_MINUTE: ${FALCO_FORWARD_MAX_EVENTS_PER_MINUTE:-120}
      FALCO_FORWARD_DEDUP_WINDOW: ${FALCO_FORWARD_DEDUP_WINDOW:-5s}
      SURICATA_EVE_FILE: /var/log/suricata/eve.json
      VIRTROID_HEALTHCHECK_URL: http://127.0.0.1:8766/healthz
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "${FALCO_FORWARDER_MEMORY_LIMIT:-256m}"
    cpus: "${FALCO_FORWARDER_CPU_LIMIT:-0.5}"
    pids_limit: ${FALCO_FORWARDER_PIDS_LIMIT:-128}
    volumes:
      - suricata-logs:/var/log/suricata:ro
    networks:
      - security-events
      - control

  suricata:
    image: ${SURICATA_IMAGE:-virtroid-suricata-profile-disabled}
    container_name: virtroid-suricata
    labels:
      com.virtroid.deployment-tree-sha256: ${VIRTROID_DEPLOYMENT_TREE_SHA256:?set VIRTROID_DEPLOYMENT_TREE_SHA256 to the reviewed deployment-tree digest}
    entrypoint: ["suricata"]
    restart: unless-stopped
    profiles:
      - nids
    depends_on:
      - falco-forwarder
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    command:
      - -i
      - ${SURICATA_INTERFACE:?set SURICATA_INTERFACE to the reviewed host ingress interface}
      - -S
      - /etc/suricata/rules/virtroid.rules
      - -l
      - /var/log/suricata
    volumes:
      - ./suricata/virtroid.rules:/etc/suricata/rules/virtroid.rules:ro
      - suricata-logs:/var/log/suricata
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/suricata/eve.json && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/lib/suricata:rw,nosuid,nodev,size=64m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: "${SURICATA_MEMORY_LIMIT:-1g}"
    cpus: "${SURICATA_CPU_LIMIT:-1.0}"
    pids_limit: ${SURICATA_PIDS_LIMIT:-512}

networks:
  database:
    internal: true
  control:
    internal: true
  blob:
    internal: true
  security-events:
    internal: true
  guest:
    name: ${NODE_DOCKER_NETWORK:?set NODE_DOCKER_NETWORK to the dedicated guest network name}
    driver: bridge
    # IPv6 egress (Docker NAT66 over an automatic ULA subnet) lets the node
    # reach remote nodes that are only addressable over IPv6.
    enable_ipv6: true
  app-egress:
    driver: bridge
    # The control plane calls remote nodes over IPv6 when they have no IPv4 forward.
    enable_ipv6: true
  renterd-egress:
    driver: bridge
  renterd-database:
    internal: true
  # indexd's admin API for virtroidd and application API for the edge.
  sia:
    internal: true
  indexd-database:
    internal: true
  indexd-egress:
    driver: bridge
  payments-egress:
    driver: bridge
  edge-egress:
    driver: bridge
  demo:
    external: true
    name: ${DEMO_NETWORK_NAME:-virtroid-demo}

volumes:
  postgres-data:
  provisioner-state:
  renterd-data:
  renterd-mysql-data:
  indexd-data:
  indexd-postgres-data:
  suricata-logs:
