groups:
  - name: virtroid-readiness
    rules:
      - alert: VirtroidControlPlaneDown
        expr: up{job="virtroidd"} != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Virtroid control plane is not scrapeable

      - alert: VirtroidControlPlaneNotReady
        expr: virtroid_control_plane_ready{service="virtroidd"} != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Virtroid has no ready approved runtime node

      - alert: VirtroidNodeDown
        expr: up{job="virtnoded"} != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Virtroid node agent is not scrapeable

      - alert: VirtroidNodeNotReady
        expr: virtroid_node_ready{service="virtnoded"} != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Virtroid node failed a readiness component

      - alert: VirtroidNodeHeartbeatFailures
        expr: increase(virtroid_node_heartbeat_total{service="virtnoded",result="failure"}[5m]) >= 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Virtroid node cannot heartbeat to the control plane

      - alert: VirtroidStaleNodesObserved
        expr: virtroid_nodes_stale{service="virtroidd"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: One or more observed Virtroid nodes have stale heartbeats

      - alert: VirtroidHighServerErrorRate
        expr: |
          sum(rate(virtroid_http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(virtroid_http_requests_total[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than five percent of Virtroid requests are failing
