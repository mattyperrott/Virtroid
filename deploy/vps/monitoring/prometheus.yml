global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: virtroidd
    metrics_path: /metrics
    static_configs:
      - targets: ["virtroidd:8080"]

  - job_name: virtnoded
    metrics_path: /metrics
    static_configs:
      - targets: ["virtnoded:8090"]
