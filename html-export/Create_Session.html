<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtroid - New Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131514;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#131514',
                        surface: '#202321',
                        surfaceLight: '#2a2d2a',
                        accent: '#A0D8B3',
                        textMuted: '#88908B',
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
</head>
<body class="w-[430px] h-[932px] overflow-hidden flex flex-col relative">

    <!-- Status Bar Area -->
    <div class="h-[54px] w-full flex items-end justify-between px-6 pb-2 text-[14px] font-medium text-white/90 z-50">
        <span>09:41</span>
        <div class="flex items-center space-x-2">
            <i class="ph-fill ph-cell-signal-full"></i>
            <i class="ph-fill ph-wifi-high"></i>
            <i class="ph-fill ph-battery-full text-[18px]"></i>
        </div>
    </div>

    <!-- Top Nav -->
    <div class="px-4 py-3 flex items-center mb-4">
        <button class="w-12 h-12 flex items-center justify-center text-white rounded-full hover:bg-surface transition-colors">
            <i class="ph ph-x text-xl"></i>
        </button>
        <span class="font-semibold text-xl tracking-tight absolute left-1/2 -translate-x-1/2">New Runtime</span>
    </div>

    <div class="flex-1 overflow-y-auto hide-scrollbar px-6 pb-40 space-y-8">

        <!-- Section: Name -->
        <div class="space-y-4">
            <label class="text-sm font-semibold text-textMuted tracking-wider uppercase pl-2 flex items-center gap-2">
                <i class="ph ph-tag"></i> Identity
            </label>
            <div class="bg-surface rounded-3xl p-5 border border-white/5 focus-within:border-accent/50 transition-colors">
                <input type="text" placeholder="Session Name (e.g. Work Alt)" class="w-full bg-transparent text-lg text-white placeholder-textMuted/60 outline-none font-medium">
            </div>
        </div>

        <!-- Section: Security Profile -->
        <div class="space-y-4">
            <label class="text-sm font-semibold text-textMuted tracking-wider uppercase pl-2 flex items-center gap-2">
                <i class="ph ph-fingerprint"></i> Threat Model
            </label>
            
            <div class="flex flex-col gap-3">
                <!-- Option 1: Standard -->
                <label class="relative bg-surface rounded-3xl p-5 border border-white/5 cursor-pointer hover:bg-surfaceLight transition-colors flex items-start gap-4">
                    <input type="radio" name="profile" class="sr-only">
                    <div class="w-6 h-6 rounded-full border-2 border-textMuted flex items-center justify-center mt-0.5"></div>
                    <div>
                        <h4 class="text-base font-semibold text-white">Standard Persistent</h4>
                        <p class="text-sm text-textMuted mt-1 leading-snug">Data is saved between sessions. Acts like a normal second phone.</p>
                    </div>
                </label>

                <!-- Option 2: Ephemeral (Selected state styling) -->
                <label class="relative bg-[#1c241f] rounded-3xl p-5 border border-accent cursor-pointer flex items-start gap-4 overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-accent/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                    <input type="radio" name="profile" checked class="sr-only">
                    <div class="w-6 h-6 rounded-full border-2 border-accent flex items-center justify-center mt-0.5">
                        <div class="w-3 h-3 bg-accent rounded-full"></div>
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2">
                            <h4 class="text-base font-semibold text-accent">Amnesic / Ephemeral</h4>
                            <span class="px-2 py-0.5 rounded-full bg-accent/20 text-accent text-[10px] font-bold uppercase tracking-wider">Recommended</span>
                        </div>
                        <p class="text-sm text-[#a5b2ab] mt-1 leading-snug">RAM-only partition. Entire filesystem is securely destroyed on disconnect.</p>
                    </div>
                </label>
            </div>
        </div>

        <!-- Section: Settings Toggles -->
        <div class="bg-surface rounded-3xl p-2 border border-white/5">
            <div class="flex items-center justify-between p-4 border-b border-white/5">
                <div class="flex items-center gap-3">
                    <i class="ph ph-globe-hemisphere-east text-xl text-textMuted"></i>
                    <span class="font-medium">Force Tor Routing</span>
                </div>
                <!-- Custom Toggle Switch On -->
                <div class="w-12 h-6 bg-accent rounded-full p-1 cursor-pointer flex justify-end transition-all">
                    <div class="w-4 h-4 bg-[#131514] rounded-full shadow-sm"></div>
                </div>
            </div>
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-3">
                    <i class="ph ph-speaker-high text-xl text-textMuted"></i>
                    <span class="font-medium">Audio Passthrough</span>
                </div>
                <!-- Custom Toggle Switch Off -->
                <div class="w-12 h-6 bg-surfaceLight rounded-full p-1 cursor-pointer flex items-center transition-all">
                    <div class="w-4 h-4 bg-textMuted rounded-full shadow-sm"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Sticky Bottom Bar with Action -->
    <div class="absolute bottom-0 w-full px-6 pb-10 pt-6 bg-gradient-to-t from-[#131514] via-[#131514] to-transparent">
        <button class="w-full bg-white text-[#131514] font-bold text-lg py-5 rounded-full flex items-center justify-center gap-2 shadow-[0_8px_30px_rgba(255,255,255,0.15)] hover:bg-gray-100 transition-colors">
            <i class="ph-fill ph-rocket-launch text-xl"></i>
            Provision Runtime
        </button>
    </div>

</body>
</html>
