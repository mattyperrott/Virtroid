<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Runtimes - Virtroid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#131514',
                        surface: '#1c1f1c',
                        surfaceLight: '#2a302c',
                        accent: '#A0D8B3',
                        textMuted: 'rgba(255, 255, 255, 0.5)',
                        danger: '#ef4444'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131514;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-black">
    <!-- Android Viewport Wrapper -->
    <div class="w-[430px] h-[932px] bg-background relative overflow-hidden flex flex-col shadow-2xl rounded-[3rem] border-[6px] border-[#0a0a0a]">
        
        <!-- Status Bar -->
        <div class="h-14 flex items-center justify-between px-6 text-white text-[15px] font-medium z-50">
            <span>9:41</span>
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-wifi-high text-lg"></i>
                <i class="ph-fill ph-cell-signal-full text-lg"></i>
                <i class="ph-fill ph-battery-full text-xl"></i>
            </div>
        </div>

        <!-- Header -->
        <div class="px-6 pt-2 pb-6 flex items-center justify-between">
            <div>
                <p class="text-textMuted text-xs font-semibold tracking-[0.15em] mb-1">SECURE CLIENT</p>
                <h1 class="text-3xl font-semibold tracking-tight">My Runtimes</h1>
            </div>
            <div class="flex gap-3">
                <button class="w-12 h-12 bg-surface rounded-full flex items-center justify-center text-white/80 hover:bg-surfaceLight transition-colors">
                    <i class="ph ph-magnifying-glass text-xl"></i>
                </button>
                <div class="relative">
                    <button class="w-12 h-12 bg-surface rounded-full flex items-center justify-center text-white">
                        <i class="ph ph-bell text-xl"></i>
                    </button>
                    <span class="absolute top-3 right-3 w-2.5 h-2.5 bg-accent rounded-full border-2 border-surface"></span>
                </div>
            </div>
        </div>

        <!-- Scrollable Runtime List -->
        <div class="flex-1 overflow-y-auto hide-scrollbar px-6 space-y-5 pb-32">
            
            <!-- Active Session Card -->
            <div class="bg-surface rounded-4xl p-1 shadow-lg relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-accent/10 rounded-full blur-[40px] pointer-events-none"></div>
                
                <div class="p-6 relative z-10">
                    <div class="flex justify-between items-start mb-6">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-surfaceLight rounded-2xl flex items-center justify-center text-accent shadow-inner border border-white/5">
                                <i class="ph-fill ph-device-mobile text-2xl"></i>
                            </div>
                            <div>
                                <h2 class="text-lg font-semibold tracking-tight">Primary Nexus</h2>
                                <p class="text-xs text-textMuted flex items-center gap-1.5 mt-0.5 font-medium">
                                    <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse shadow-[0_0_8px_rgba(160,216,179,0.8)]"></span>
                                    Session Active
                                </p>
                            </div>
                        </div>
                        <button class="w-10 h-10 rounded-full bg-surfaceLight flex items-center justify-center text-textMuted hover:text-white transition-colors">
                            <i class="ph ph-dots-three-vertical text-xl"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-5 mb-7">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-textMuted uppercase tracking-wider font-semibold mb-1">Uptime</span>
                            <span class="text-sm font-medium">12h 45m</span>
                        </div>
                        <div class="w-px h-8 bg-white/10"></div>
                        <div class="flex flex-col">
                            <span class="text-[10px] text-textMuted uppercase tracking-wider font-semibold mb-1">Region</span>
                            <span class="text-sm font-medium flex items-center gap-1"><i class="ph-fill ph-globe-hemisphere-west text-textMuted"></i> US-East</span>
                        </div>
                        <div class="w-px h-8 bg-white/10"></div>
                        <div class="flex flex-col">
                            <span class="text-[10px] text-textMuted uppercase tracking-wider font-semibold mb-1">Ping</span>
                            <span class="text-sm font-medium">24ms</span>
                        </div>
                    </div>

                    <button class="w-full bg-accent text-[#131514] font-semibold py-4 rounded-3xl flex items-center justify-center gap-2 hover:bg-[#8ec29f] transition-colors shadow-[0_4px_20px_rgba(160,216,179,0.15)]">
                        Connect 
                        
                    
                   
                   
                   
                    
                    <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- Inactive Session Card -->
            <div class="bg-surface rounded-4xl p-6 border border-white/5">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-surfaceLight rounded-2xl flex items-center justify-center text-white/50 border border-white/5">
                            <i class="ph ph-ghost text-2xl"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-semibold tracking-tight text-white/90">Ephemeral Burner</h2>
                            <p class="text-xs text-textMuted flex items-center gap-1.5 mt-0.5 font-medium">
                                <span class="w-1.5 h-1.5 rounded-full bg-white/20"></span>
                                Offline · Standby
                            </p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button class="flex-1 bg-surfaceLight hover:bg-[#343936] text-white font-medium py-3.5 rounded-3xl flex items-center justify-center gap-2 transition-colors">
                        <i class="ph-fill ph-play text-accent"></i>
                        Start Node
                    </button>
                    <button class="w-14 bg-surfaceLight hover:bg-surfaceLight/80 text-white font-medium rounded-3xl flex items-center justify-center transition-colors">
                        <i class="ph ph-sliders-horizontal text-lg text-textMuted"></i>
                    </button>
                    <button class="w-14 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-medium rounded-3xl flex items-center justify-center transition-colors">
                        <i class="ph ph-trash text-lg"></i>
                    </button>
                </div>
            </div>
            
        </div>

        <!-- Floating Bottom Navigation -->
        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] h-16 bg-surface/80 backdrop-blur-xl border border-white/10 rounded-full flex items-center justify-between px-2 z-50 shadow-2xl">
            <button class="w-12 h-12 rounded-full flex items-center justify-center text-accent bg-surface/50">
                <i class="ph-fill ph-hard-drives text-2xl"></i>
            </button>
            <button class="w-12 h-12 rounded-full flex items-center justify-center text-textMuted hover:text-white transition-colors">
                <i class="ph ph-shield-check text-2xl"></i>
            </button>
            <button class="h-12 px-6 bg-accent text-[#131514] font-semibold rounded-full flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(160,216,179,0.3)]">
                <i class="ph-bold ph-plus"></i>
                New
            </button>
            <button class="w-12 h-12 rounded-full flex items-center justify-center text-textMuted hover:text-white transition-colors">
                <i class="ph ph-user text-2xl"></i>
            </button>
            <button class="w-12 h-12 rounded-full flex items-center justify-center text-textMuted hover:text-white transition-colors">
                <i class="ph ph-gear text-2xl"></i>
            </button>
        </div>

        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/30 rounded-full"></div>
    </div>

</body></html>
