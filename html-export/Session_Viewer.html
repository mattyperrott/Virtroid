<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Session - Virtroid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#131514',
                        surface: '#1c1f1c',
                        surfaceLight: '#2a302c',
                        accent: '#A0D8B3',
                        textMuted: 'rgba(255, 255, 255, 0.5)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131514;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        .virtual-screen {
            background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1500&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .app-icon {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-black">
    <!-- Android Viewport Wrapper -->
    <div class="w-[430px] h-[932px] bg-background relative overflow-hidden flex flex-col shadow-2xl rounded-[3rem] border-[6px] border-[#0a0a0a]">
        
        <!-- Fixed Top App Bar (Session Controls) -->
        <div class="h-[76px] bg-[#111211]/95 backdrop-blur-xl border-b border-white/5 flex items-center justify-between px-4 z-50 flex-shrink-0 pt-3 pb-3 relative">
            
            <!-- Left: Disconnect & Connection Status -->
            <div class="flex items-center gap-3">
                <button class="w-[42px] h-[42px] rounded-full bg-red-500/10 text-red-400 flex items-center justify-center hover:bg-red-500/20 transition-colors">
                    <i class="ph-bold ph-power text-xl"></i>
                </button>
                <div class="flex flex-col">
                    <span class="text-sm font-semibold text-white/95 tracking-tight">Primary Nexus</span>
                    <span class="text-[11px] text-accent flex items-center gap-1.5 font-medium mt-0.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse shadow-[0_0_8px_rgba(160,216,179,0.8)]"></span>
                        Secure · 24ms
                    </span>
                </div>
            </div>

            <!-- Right: Action Buttons -->
            <div class="flex items-center gap-2">
                <!-- Camera Button -->
                <button class="w-[42px] h-[42px] rounded-full bg-surface text-white/80 hover:bg-surfaceLight hover:text-white transition-colors flex items-center justify-center">
                    <i class="ph ph-camera text-[22px]"></i>
                </button>
                <!-- File Upload Button -->
                <button class="w-[42px] h-[42px] rounded-full bg-surface text-white/80 hover:bg-surfaceLight hover:text-white transition-colors flex items-center justify-center">
                    <i class="ph ph-file-arrow-up text-[22px]"></i>
                </button>
                <!-- Settings Drawer Button -->
                <button class="w-[42px] h-[42px] rounded-full bg-accent/10 border border-accent/20 text-accent hover:bg-accent/20 transition-colors flex items-center justify-center relative shadow-[0_0_10px_rgba(160,216,179,0.1)]">
                    <i class="ph ph-faders text-[22px]"></i>
                </button>
            </div>
        </div>

        <!-- Full Width/Height Virtual Viewer Screen -->
        <div class="flex-1 w-full relative virtual-screen overflow-hidden flex flex-col justify-between">
            
            <!-- Virtual Status Bar -->
            <div class="h-8 bg-black/30 backdrop-blur-md flex items-center justify-between px-4 z-40 w-full border-b border-white/5">
                <span class="text-[11px] font-medium text-white/90">12:30</span>
                <div class="flex items-center gap-1.5 text-white/90">
                    <i class="ph-fill ph-clock-counter-clockwise text-xs mr-1 opacity-70"></i>
                    <i class="ph-fill ph-wifi-high text-xs text-accent"></i>
                    <i class="ph-fill ph-cell-signal-full text-xs text-accent"></i>
                    <i class="ph-fill ph-battery-full text-xs"></i>
                </div>
            </div>

            <!-- Virtual Search Widget -->
            <div class="px-4 mt-8">
                <div class="h-12 rounded-full app-icon flex items-center px-4 gap-3 text-white/70">
                    <i class="ph ph-google-logo text-lg"></i>
                    <span class="text-sm font-medium flex-1">Private Search...</span>
                    <i class="ph ph-microphone text-lg"></i>
                    <i class="ph ph-corners-out text-lg"></i>
                </div>
            </div>

            <!-- Virtual App Grid & Dock -->
            <div class="mt-auto pb-10 px-4 space-y-8">
                
                <!-- App Grid row -->
                <div class="grid grid-cols-4 gap-4 px-2">
                    <div class="flex flex-col items-center gap-2 group cursor-pointer">
                        <div class="w-14 h-14 rounded-2xl app-icon flex items-center justify-center text-white/90 group-hover:scale-105 transition-transform">
                            <i class="ph-fill ph-folder-lock text-3xl text-accent"></i>
                        </div>
                        <span class="text-[11px] font-medium text-white shadow-sm">Vault</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 group cursor-pointer">
                        <div class="w-14 h-14 rounded-2xl app-icon flex items-center justify-center text-white/90 group-hover:scale-105 transition-transform">
                            <i class="ph-fill ph-camera text-3xl"></i>
                        </div>
                        <span class="text-[11px] font-medium text-white shadow-sm">Camera</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 group cursor-pointer">
                        <div class="w-14 h-14 rounded-2xl app-icon flex items-center justify-center text-white/90 group-hover:scale-105 transition-transform">
                            <i class="ph-fill ph-file-pdf text-3xl"></i>
                        </div>
                        <span class="text-[11px] font-medium text-white shadow-sm">Files</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 group cursor-pointer">
                        <div class="w-14 h-14 rounded-2xl app-icon flex items-center justify-center text-white/90 group-hover:scale-105 transition-transform">
                            <i class="ph-fill ph-gear text-3xl"></i>
                        </div>
                        <span class="text-[11px] font-medium text-white shadow-sm">Settings</span>
                    </div>
                </div>

                <!-- Dock -->
                <div class="h-20 rounded-[2rem] app-icon flex items-center justify-around px-2">
                    <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center hover:scale-105 transition-transform cursor-pointer border border-white/5">
                        <i class="ph-fill ph-phone text-3xl text-green-400"></i>
                    </div>
                    <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center hover:scale-105 transition-transform cursor-pointer border border-white/5">
                        <i class="ph-fill ph-chat-circle text-3xl text-blue-400"></i>
                    </div>
                    <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center hover:scale-105 transition-transform cursor-pointer border border-white/5">
                        <i class="ph-fill ph-globe text-3xl text-accent"></i>
                    </div>
                    <div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center hover:scale-105 transition-transform cursor-pointer border border-white/5">
                        <i class="ph-fill ph-faders text-3xl text-gray-300"></i>
                    </div>
                </div>
                
                <!-- Virtual Home Indicator margin buffer -->
                <div class="h-1"></div>
            </div>

            <!-- Virtual OS Nav / Home Indicator -->
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full z-40"></div>
        </div>

        <!-- Host OS Home Indicator (overlaying everything at bottom) -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[140px] h-1.5 bg-white/30 rounded-full z-[100] pointer-events-none"></div>
    </div>
</body>
</html>
