            (function() {
                const OriginalIntersectionObserver = window.IntersectionObserver;
                if (!OriginalIntersectionObserver) return;
                window.IntersectionObserver = function(callback, options) {
                    const observer = new OriginalIntersectionObserver(function(entries, obs) {
                        // Force all entries to appear as intersecting
                        const modifiedEntries = entries.map(entry => ({
                            target: entry.target,
                            isIntersecting: true,
                            intersectionRatio: 1,
                            boundingClientRect: entry.boundingClientRect,
                            intersectionRect: entry.intersectionRect,
                            rootBounds: entry.rootBounds,
                            time: entry.time,
                        }));
                        callback(modifiedEntries, obs);
                    }, options);

                    // Also immediately trigger for any observed element
                    const originalObserve = observer.observe.bind(observer);
                    observer.observe = function(target) {
                        originalObserve(target);
                        // Trigger callback immediately with the element as intersecting
                        setTimeout(() => {
                            callback([{
                                target: target,
                                isIntersecting: true,
                                intersectionRatio: 1,
                                boundingClientRect: target.getBoundingClientRect(),
                                intersectionRect: target.getBoundingClientRect(),
                                rootBounds: null,
                                time: performance.now(),
                            }], observer);
                        }, 0);
                    };

                    return observer;
                };
                window.IntersectionObserver.prototype = OriginalIntersectionObserver.prototype;
            })();

                                // body-innerHTML swap can replay this rewrite

                                // this, the swap drops our Serper-replaced src
                                // and the image re-requests on parse, causing

                                if (!img.dataset.originalSrc) {
